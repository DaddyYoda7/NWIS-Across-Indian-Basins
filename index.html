  <script>
    // Global keyboard shortcut Ctrl+K
    window.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        const searchInput = document.querySelector('input[type="text"]');
        if (searchInput) searchInput.focus();
      }
    });

    // Reactive Header Well Telemetry Synchronization
    window.addEventListener('nwis:activeWellChanged', e => {
      const well = e.detail;
      if (!well) return;
      const nameEl = document.getElementById('header-active-well-name');
      const statusEl = document.getElementById('header-active-well-status');
      const depthEl = document.getElementById('header-active-well-depth');
      if (nameEl) nameEl.textContent = well.short_code;
      if (statusEl) statusEl.textContent = well.field || well.basin;
      if (depthEl) depthEl.textContent = `${well.total_depth_md_m} m (${well.target_formation.split(' ')[0]})`;
    });
  </script>
